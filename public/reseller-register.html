<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Reseller - Fahmi Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #111827, #030712); font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="glass-card p-8 rounded-2xl shadow-2xl max-w-sm w-full border border-gray-800 relative overflow-hidden">
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="text-center mb-8 relative z-10">
            <h2 class="text-2xl font-extrabold text-white mb-1">Gabung Reseller</h2>
            <p class="text-xs text-gray-400">Jual kembali layanan Fahmi Hosting</p>
        </div>
        <form id="registerForm" class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Nama Lengkap</label>
                <input type="text" id="name" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition-all" placeholder="Budi Setiawan" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="email" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition-all" placeholder="reseller@mail.com" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition-all" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-lg transition-all mt-2">Daftar Sekarang</button>
        </form>
        <p class="text-center text-xs text-gray-400 mt-6 relative z-10">Sudah punya akun? <a href="reseller-login.html" class="text-emerald-400 hover:underline">Masuk disini</a></p>
    </div>
</body>
</html>
