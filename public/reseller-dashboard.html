<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FahmiHost - Reseller Dashboard</title>
    <!-- Font: Inter for modern, highly readable typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        brand: { primary: '#4F46E5', primaryHover: '#4338CA' }, 
                        surface: { 100: '#18181B', 200: '#27272A' },
                        base: '#09090B'
                    } 
                } 
            } 
        }
    </script>
    <style>
        body { background-color: #09090b; color: #A1A1AA; font-family: 'Inter', sans-serif; }
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272A; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3F3F46; }
        
        /* Remove default input arrows */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- SIDEBAR: Solid background, subtle border, clear typography -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-base border-r border-surface-200 transform -translate-x-full md:translate-x-0 transition-transform duration-200 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-surface-200">
            <div class="w-6 h-6 rounded bg-brand-primary flex items-center justify-center text-white text-xs font-bold mr-3">F</div>
            <h1 class="text-sm font-semibold text-zinc-100 tracking-tight">FahmiHost</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <!-- Active State: Subtle background, white text -->
            <a href="javascript:void(0)" onclick="switchPage('dashboard')" class="nav-item active-nav flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors bg-surface-200 text-zinc-100">
                <i class="fa-solid fa-chart-pie w-4 text-zinc-400"></i> Dashboard
            </a>
            <a href="javascript:void(0)" onclick="switchPage('topup')" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:bg-surface-100 hover:text-zinc-100">
                <i class="fa-solid fa-wallet w-4"></i> Deposit Saldo
            </a>
            <a href="javascript:void(0)" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-zinc-400 hover:bg-surface-100 hover:text-zinc-100">
                <i class="fa-solid fa-server w-4"></i> Kelola Server
            </a>
            
            <div class="pt-8">
                <a href="javascript:void(0)" onclick="logoutReseller()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors text-red-400/80 hover:bg-red-500/10 hover:text-red-400">
                    <i class="fa-solid fa-right-from-bracket w-4"></i> Keluar
                </a>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative md:ml-64 bg-base">
        <!-- HEADER: Clean, border-only separation -->
        <header class="h-16 border-b border-surface-200 px-6 flex items-center justify-between shrink-0 bg-base">
            <div class="flex items-center gap-4">
                <button type="button" onclick="toggleSidebar()" class="md:hidden text-zinc-400 hover:text-zinc-100 transition-colors">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 class="text-sm font-medium text-zinc-100">Overview</h2>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 md:p-8">
            <!-- DASHBOARD SECTION -->
            <div id="page-dashboard" class="page-section active max-w-4xl space-y-6">
                <!-- User Card: Flat design, strict alignment -->
                <div class="bg-surface-100 rounded-xl p-6 border border-surface-200 flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div>
                        <h3 class="text-lg font-semibold text-zinc-100" id="uiResellerName">Fahmi</h3>
                        <p class="text-sm text-zinc-400 mt-0.5" id="uiResellerEmail">admin@fahmihost.com</p>
                        <div class="flex flex-wrap gap-2 mt-4">
                            <span class="text-[11px] bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-md font-medium tracking-wide uppercase">Aktif</span>
                            <span class="text-[11px] bg-surface-200 text-zinc-300 px-2 py-1 rounded-md font-medium"><i class="fa-brands fa-whatsapp mr-1"></i> Terhubung</span>
                        </div>
                    </div>
                    <div class="text-left md:text-right">
                        <p class="text-xs text-zinc-500 font-medium uppercase tracking-wider mb-1">Total Saldo</p>
                        <h3 class="text-2xl font-bold text-zinc-100" id="uiResellerSaldo">Rp 1.450.000</h3>
                    </div>
                </div>

                <!-- Action Card: Removed heavy gradient, focused on function -->
                <div class="bg-surface-100 rounded-xl p-6 border border-surface-200">
                    <div class="mb-5">
                        <h3 class="text-sm font-semibold text-zinc-100">Link Order Customer</h3>
                        <p class="text-sm text-zinc-500 mt-1">Buat tautan pembayaran aman untuk pesanan baru.</p>
                    </div>
                    <div class="flex gap-3">
                        <input type="text" readonly id="secureOrderLinkInput" placeholder="Menunggu *generate*..." class="flex-1 bg-base border border-surface-200 rounded-lg px-4 py-2.5 text-sm text-zinc-300 font-mono focus:outline-none focus:border-brand-primary transition-colors">
                        <button onclick="generateLinkDariServer()" id="btnGenLink" class="bg-zinc-100 hover:bg-white text-zinc-900 px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">Generate</button>
                    </div>
                </div>
            </div>

            <!-- TOPUP SECTION -->
            <div id="page-topup" class="page-section max-w-2xl space-y-6">
                <div class="bg-surface-100 rounded-xl p-6 border border-surface-200">
                    <h3 class="text-sm font-semibold text-zinc-100 mb-6">Deposit Saldo</h3>
                    
                    <div class="space-y-6">
                        <!-- Nominal Selection -->
                        <div class="space-y-3">
                            <label class="text-xs font-medium text-zinc-400 uppercase tracking-wider">Pilih Nominal</label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                <!-- Standardizing active state via border and bg -->
                                <button type="button" class="border border-surface-200 bg-base rounded-lg py-3 text-sm font-medium text-zinc-300 hover:border-zinc-500 transition-colors">10.000</button>
                                <button type="button" class="border border-surface-200 bg-base rounded-lg py-3 text-sm font-medium text-zinc-300 hover:border-zinc-500 transition-colors">25.000</button>
                                <!-- Active Example -->
                                <button type="button" class="border border-brand-primary bg-brand-primary/10 rounded-lg py-3 text-sm font-medium text-brand-primary transition-colors">50.000</button>
                                <button type="button" class="border border-surface-200 bg-base rounded-lg py-3 text-sm font-medium text-zinc-300 hover:border-zinc-500 transition-colors">100.000</button>
                            </div>
                        </div>

                        <!-- Custom Input -->
                        <div class="space-y-3">
                            <label class="text-xs font-medium text-zinc-400 uppercase tracking-wider">Nominal Khusus</label>
                            <div class="relative">
                                <span class="absolute left-4 top-3 text-zinc-500 text-sm font-medium">Rp</span>
                                <input type="number" placeholder="0" value="50000" class="w-full bg-base border border-surface-200 rounded-lg pl-11 pr-4 py-3 text-sm text-zinc-100 focus:outline-none focus:border-brand-primary transition-colors">
                            </div>
                        </div>

                        <div class="pt-2">
                            <!-- Primary CTA -->
                            <button type="button" class="w-full bg-brand-primary hover:bg-brand-primaryHover text-white font-medium py-3 rounded-lg text-sm transition-colors">Lanjutkan via QRIS</button>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        // Minimalist JS logic to switch views (Function over fashion)
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            
            // Reset nav state
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-surface-200', 'text-zinc-100', 'active-nav');
                el.classList.add('text-zinc-400');
            });
            event.currentTarget.classList.add('bg-surface-200', 'text-zinc-100', 'active-nav');
            event.currentTarget.classList.remove('text-zinc-400');
        }
    </script>
</body>
</html>
