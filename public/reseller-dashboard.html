<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pterodactyl Reseller Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 750: '#243347', 850: '#151e2e', 900: '#0F172A' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0F172A; color: #94A3B8; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Animasi Modal & Dropdown */
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .fade-out { animation: fadeOut 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }
    </style>
</head>
<body class="antialiased min-h-screen flex">

    <!-- SIDEBAR (Tetap sama seperti sebelumnya) -->
    <aside class="w-64 bg-slate-900 border-r border-slate-700/60 flex flex-col hidden md:flex sticky top-0 h-screen shrink-0">
        <!-- Konten Sidebar... -->
        <div class="h-16 flex items-center px-6 border-b border-slate-700/60">
            <div class="w-7 h-7 rounded bg-blue-600 flex items-center justify-center text-white text-sm font-bold mr-3 shadow-sm shadow-blue-900/50">
                <i class="fa-solid fa-server text-[11px]"></i>
            </div>
            <h1 class="text-sm font-bold text-slate-100 tracking-tight">FAGYM PANEL</h1>
        </div>
        <nav class="flex-1 px-3 py-6 space-y-1.5 overflow-y-auto">
            <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Main Menu</p>
            <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium bg-slate-800 text-blue-400 border-l-2 border-blue-500">
                <i class="fa-solid fa-chart-pie w-4"></i> Dashboard
            </a>
            <!-- Menu Lainnya... -->
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#0B1120] relative">
        
        <!-- HEADER UPDATE: USER DROPDOWN -->
        <header class="h-16 border-b border-slate-700/60 px-6 flex items-center justify-between bg-slate-900/50 backdrop-blur-sm sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <h2 class="text-sm font-semibold text-slate-200">Reseller Overview</h2>
            </div>
            
            <div class="flex items-center gap-4 relative">
                <button class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">
                    <i class="fa-regular fa-bell text-xs"></i>
                </button>
                <div class="h-5 w-px bg-slate-700"></div>
                
                <!-- DROPDOWN TRIGGER -->
                <button onclick="toggleDropdown(event)" class="flex items-center gap-3 cursor-pointer hover:bg-slate-800 p-1.5 rounded-lg transition-colors focus:outline-none">
                    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold border border-blue-500 shadow-sm" id="ui-avatar">
                        F
                    </div>
                    <div class="hidden sm:block text-left pr-1">
                        <p class="text-xs font-semibold text-slate-200 leading-none" id="ui-firstname">Fahmi</p>
                        <p class="text-[10px] text-slate-500 mt-1" id="ui-status">Verified</p>
                    </div>
                    <i id="dropdown-icon" class="fa-solid fa-chevron-down text-[10px] text-slate-500 transition-transform duration-200"></i>
                </button>

                <!-- DROPDOWN MENU -->
                <div id="userDropdown" class="hidden absolute right-0 top-12 mt-2 w-56 origin-top-right bg-slate-800 border border-slate-700 rounded-xl shadow-lg ring-1 ring-black ring-opacity-5 z-50">
                    <div class="py-1">
                        <button onclick="openModal()" class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700/50 hover:text-white transition-colors">
                            <i class="fa-regular fa-user w-4 text-center"></i> Profil Saya
                        </button>
                        <button class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-700/50 hover:text-white transition-colors">
                            <i class="fa-solid fa-gear w-4 text-center"></i> Pengaturan Akun
                        </button>
                        <div class="h-px bg-slate-700/60 my-1"></div>
                        <button class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-sm text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 transition-colors">
                            <i class="fa-solid fa-right-from-bracket w-4 text-center"></i> Keluar
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- DASHBOARD CONTENT (Widget letakkan di sini) -->
        <div class="p-6 overflow-y-auto">
            <!-- Bento Grid... -->
        </div>
    </main>

    <!-- MODAL PROFILE DETAIL -->
    <div id="profileModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/70 backdrop-blur-sm transition-opacity">
        <!-- Modal Card -->
        <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-xl shadow-2xl overflow-hidden m-4 fade-in">
            <!-- Header Modal -->
            <div class="flex justify-between items-center px-6 py-4 border-b border-slate-700/60 bg-slate-800/50">
                <h3 class="text-lg font-bold text-slate-100">Detail Akun Reseller</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Body Modal (Menyesuaikan Schema index.js) -->
            <div class="p-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Nama -->
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Nama Lengkap</label>
                        <p class="text-sm font-medium text-slate-100" id="modal-name">Fahmi Ilham Gymnastiar</p>
                    </div>
                    <!-- Email -->
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Email</label>
                        <p class="text-sm font-medium text-slate-100" id="modal-email">admin@fahmihost.com</p>
                    </div>
                    <!-- WhatsApp -->
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Nomor WhatsApp</label>
                        <p class="text-sm font-mono font-medium text-slate-100" id="modal-wa">+6281234567890</p>
                    </div>
                    <!-- Telegram -->
                    <div class="space-y-1">
                        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Telegram Terhubung</label>
                        <div class="flex items-center gap-2">
                            <i class="fa-brands fa-telegram text-blue-400"></i>
                            <p class="text-sm font-medium text-slate-100" id="modal-tele">ID: 8521019587</p>
                        </div>
                    </div>
                    <!-- Password (Full width col-span-2) -->
                    <div class="space-y-2 sm:col-span-2 pt-2 border-t border-slate-700/50 mt-2">
                        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Keamanan Akun (Password)</label>
                        <div class="flex items-center justify-between bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2">
                            <p class="text-sm font-mono font-bold text-slate-500 tracking-[0.2em]">••••••••••••</p>
                            <button class="text-xs font-medium text-blue-400 hover:text-blue-300 transition-colors">Ubah Password</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Modal -->
            <div class="px-6 py-4 border-t border-slate-700/60 bg-slate-800/50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-700 transition-colors">
                    Tutup
                </button>
                <button class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-colors">
                    Edit Data
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT UNTUK INTERAKSI -->
    <script>
        const dropdown = document.getElementById('userDropdown');
        const dropdownIcon = document.getElementById('dropdown-icon');
        const profileModal = document.getElementById('profileModal');
        const modalContent = profileModal.querySelector('div');

        // Toggle Dropdown
        function toggleDropdown(event) {
            event.stopPropagation();
            const isHidden = dropdown.classList.contains('hidden');
            
            if (isHidden) {
                dropdown.classList.remove('hidden');
                dropdown.classList.add('fade-in');
                dropdownIcon.style.transform = 'rotate(180deg)';
            } else {
                closeDropdown();
            }
        }

        function closeDropdown() {
            dropdown.classList.add('hidden');
            dropdown.classList.remove('fade-in');
            dropdownIcon.style.transform = 'rotate(0deg)';
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            if (!dropdown.contains(event.target)) {
                closeDropdown();
            }
        });

        // Buka Modal Profil
        function openModal() {
            closeDropdown();
            profileModal.classList.remove('hidden');
            profileModal.classList.add('flex');
            
            // Animasi masuk
            modalContent.classList.remove('fade-out');
            modalContent.classList.add('fade-in');
        }

        // Tutup Modal Profil
        function closeModal() {
            // Animasi keluar
            modalContent.classList.remove('fade-in');
            modalContent.classList.add('fade-out');
            
            // Tunggu animasi selesai baru di-hide
            setTimeout(() => {
                profileModal.classList.add('hidden');
                profileModal.classList.remove('flex');
            }, 200); // 200ms sama dengan durasi animasi
        }

            document.getElementById('modal-email').innerText = user.email;
            document.getElementById('modal-wa').innerText = user.whatsapp;
            document.getElementById('modal-tele').innerText = user.telegram;
        }
        // window.onload = loadUserData;
        */
    </script>
</body>
</html>
