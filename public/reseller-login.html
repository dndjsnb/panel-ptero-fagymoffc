<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Reseller - Fahmi Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #111827, #030712); font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="glass-card p-8 rounded-2xl shadow-2xl max-w-sm w-full border border-gray-800 relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="text-center mb-8 relative z-10">
            <h2 class="text-2xl font-extrabold text-white mb-1">Portal Reseller</h2>
            <p class="text-xs text-gray-400">Masuk untuk mengelola pelanggan</p>
        </div>
        <form id="loginForm" class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="email" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-all" placeholder="reseller@mail.com" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-all" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-lg transition-all mt-2">Masuk ke Dashboard</button>
            
            <!-- Tempat Notifikasi UI -->
            <div id="alertBox" class="hidden mt-4 p-3 rounded-xl text-sm font-semibold text-center transition-all"></div>
        </form>
        <p class="text-center text-xs text-gray-400 mt-6 relative z-10">Belum punya akun? <a href="reseller-register.html" class="text-blue-400 hover:underline">Daftar Gratis</a></p>
    </div>

    <!-- Script API Backend buat Login -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.querySelector('button[type="submit"]');

            submitBtn.innerText = "Mengecek...";
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                // Bersihin warna notif
                alertBox.classList.remove('hidden', 'bg-blue-500/20', 'text-blue-400', 'bg-red-500/20', 'text-red-400');

                if (response.ok) {
                    // Kalau login bener
                    alertBox.classList.add('bg-blue-500/20', 'text-blue-400');
                    alertBox.innerText = result.message; 
                    
                    // Delay dikit terus pindah ke dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html'; // PENTING: Ganti nama file ini kalau beda!
                    }, 1500);
                } else {
                    // Kalau password/email salah
                    alertBox.classList.add('bg-red-500/20', 'text-red-400');
                    alertBox.innerText = result.message; 
                }
                
                alertBox.classList.remove('hidden');

            } catch (error) {
                alertBox.classList.remove('hidden', 'bg-blue-500/20', 'text-blue-400');
                alertBox.classList.add('bg-red-500/20', 'text-red-400');
                alertBox.innerText = 'Server error/gagal dihubungi, Cok!';
            } finally {
                submitBtn.innerText = "Masuk ke Dashboard";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
