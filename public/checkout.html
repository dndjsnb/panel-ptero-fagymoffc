<script>
    const urlParams = new URLSearchParams(window.location.search);
    const planKey = urlParams.get('plan');
    const price = urlParams.get('price');
    const planName = urlParams.get('name');

    // 1. Otomatis Generate QRIS pas halaman dibuka
    window.onload = async () => {
        const res = await fetch('/api/generate-qris', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: price, plan_key: planKey })
        });
        const data = await res.json();
        
        if (data.qr_url) {
            document.getElementById('qrisImage').src = data.qr_url; // Gambar QRIS asli muncul!
        } else {
            alert("Gagal memuat QRIS: " + data.error);
        }
    };

    // 2. Tampilkan info tagihan
    document.getElementById('invoicePlan').innerText = planName;
    document.getElementById('invoicePrice').innerText = 'Rp ' + parseInt(price).toLocaleString('id-ID');

    // 3. Tombol konfirmasi tetep sama, buat nge-trigger Pterodactyl Auto-Create
    document.getElementById('btnKonfirmasi').addEventListener('click', async () => {
        // ... (Kode konfirmasi yang tadi, biarin tetep) ...
    });
</script>
