<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Fahmi Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #111827, #030712); font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="glass-card p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full border border-gray-800 relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10" id="headerTitle">
            <h2 class="text-xl sm:text-2xl font-extrabold text-center text-white mb-2">Checkout Pembayaran</h2>
            <p class="text-xs text-center text-gray-400 mb-6">Selesaikan transaksi untuk mengaktifkan server Anda.</p>
        </div>

        <div id="uiAlert" class="hidden relative z-10 mb-6 p-3.5 rounded-xl border text-xs sm:text-sm font-medium text-center transition-all shadow-lg"></div>

        <div id="mainContent" class="relative z-10 space-y-5">
            <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-800/80 flex items-center justify-between">
                <div>
                    <span class="text-[11px] uppercase tracking-wider text-gray-500 font-semibold">Paket</span>
                    <h3 id="invoicePlan" class="text-base font-bold text-gray-100">Memuat...</h3>
                </div>
                <div class="text-right">
                    <span class="text-[11px] uppercase tracking-wider text-gray-500 font-semibold">Harga Asli</span>
                    <h3 id="invoicePrice" class="text-lg font-black text-emerald-400">Rp 0</h3>
                </div>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Username Panel</label>
                    <input type="text" id="usernameInput" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-blue-500 transition-all" placeholder="fagem" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Password Panel</label>
                    <input type="password" id="passwordInput" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-blue-500 transition-all" placeholder="Buat password login Anda" required>
                </div>
            </div>

            <div class="text-center bg-gray-900/40 p-4 rounded-xl border border-gray-800/50">
                <p class="text-xs text-gray-400 mb-3 font-medium">Scan QRIS untuk bayar:</p>
                <div class="bg-white p-3 rounded-xl inline-block w-44 h-44 flex items-center justify-center mx-auto shadow-md relative overflow-hidden">
                    <div id="qrisLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-50 text-gray-400"><span class="text-[10px] font-bold">MEMBUAT QR...</span></div>
                    <img id="qrisImage" src="" alt="QRIS" class="w-full h-full object-contain hidden relative z-10 rounded-lg">
                </div>
            </div>

            <button id="btnKonfirmasi" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg transition-all">Saya Sudah Bayar</button>
        </div>
    </div>

    <script>
        let currentTopupId = null;
        function showNotification(msg, type='error') {
            const box = document.getElementById('uiAlert');
            box.className = `relative z-10 mb-6 p-3.5 rounded-xl border text-xs sm:text-sm font-medium text-center transition-all ${type==='error'?'bg-red-950/60 border-red-800/80 text-red-300':'bg-emerald-950/60 border-emerald-800/80 text-emerald-300'}`;
            box.innerText = msg; box.classList.remove('hidden');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const planKey = params.get('plan');
            const planName = params.get('name');
            const displayPrice = params.get('price'); 

            if (!planKey) return showNotification("Data paket tidak valid.", "error");
            document.getElementById('invoicePlan').innerText = planName || planKey;
            document.getElementById('invoicePrice').innerText = displayPrice ? 'Rp ' + parseInt(displayPrice).toLocaleString() : 'Menghitung...';

            try {
                // UPDATE: Jalur endpoint disesuaikan dengan nama file
                const res = await fetch(`/api/generate-qris`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan_key: planKey }) 
                });
                const data = await res.json();
                
                if (data.success && data.qr_url) {
                    const img = document.getElementById('qrisImage');
                    document.getElementById('qrisLoading').style.display = 'none';
                    img.src = data.qr_url; img.classList.remove('hidden');
                    currentTopupId = data.topup_id; 
                    if(data.real_price) document.getElementById('invoicePrice').innerText = 'Rp ' + parseInt(data.real_price).toLocaleString();
                } else {
                    showNotification("Gagal memuat QRIS.", "error");
                }
            } catch (err) { showNotification("Gangguan koneksi.", "error"); }
            
            document.getElementById('btnKonfirmasi').addEventListener('click', async () => {
                const user = document.getElementById('usernameInput').value;
                const pass = document.getElementById('passwordInput').value;
                const btn = document.getElementById('btnKonfirmasi');
                if (!user || !pass) return showNotification("Isi Username & Password!", "error");
                if (!currentTopupId) return showNotification("Sesi belum siap.", "error");
                
                btn.innerHTML = "Memeriksa..."; btn.disabled = true;
                
                try {
                    const res = await fetch('/api/webhook', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ plan_key: planKey, username: user, password: pass, topup_id: currentTopupId })
                    });
                    const data = await res.json();

                    if (res.ok && data.success && data.data_akun) {
                        document.getElementById('mainContent').style.display = 'none';
                        document.getElementById('headerTitle').style.display = 'none';
                        const box = document.getElementById('uiAlert');
                        box.className = "relative z-10 p-5 rounded-xl border border-emerald-800 bg-emerald-950/60 text-emerald-300 text-sm shadow-lg text-left";
                        box.innerHTML = `
                            <div class="text-center mb-4 text-lg font-bold text-emerald-400"> Server Dibuat!</div>
                            <div class="bg-gray-900 p-4 rounded-lg border border-emerald-800/50 space-y-2 font-mono text-xs">
                                <div><span class="text-gray-500">URL:</span> <a href="${data.data_akun.login_url}" class="text-blue-400 underline">${data.data_akun.login_url}</a></div>
                                <div><span class="text-gray-500">Username:</span> ${data.data_akun.username}</div>
                                <div><span class="text-gray-500">Password:</span> ${data.data_akun.password}</div>
                            </div>
                            <button onclick="window.open('${data.data_akun.login_url}')" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg">Masuk Panel</button>
                        `;
                        box.classList.remove('hidden');
                    } else {
                        showNotification(data.error || "Belum lunas.", "error");
                        btn.innerHTML = "Saya Sudah Bayar"; btn.disabled = false;
                    }
                } catch(e) {
                    showNotification("Error jaringan.", "error");
                    btn.innerHTML = "Saya Sudah Bayar"; btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
