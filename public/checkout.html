<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Fahmi Hosting</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top, #111827, #030712);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4 selection:bg-blue-500 selection:text-white">

    <div class="glass-card p-6 sm:p-8 rounded-2xl shadow-2xl max-w-md w-full border border-gray-800 relative overflow-hidden">
        
        <!-- Efek Glow Dekoratif -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Title -->
        <div class="relative z-10" id="headerTitle">
            <h2 class="text-xl sm:text-2xl font-extrabold text-center tracking-tight text-white mb-2">Checkout Pembayaran</h2>
            <p class="text-xs text-center text-gray-400 mb-6">Selesaikan transaksi untuk otomatis mengaktifkan server Anda.</p>
        </div>

        <!-- Kotak Notifikasi UI (Juga dipakai buat nampilin data akun nanti) -->
        <div id="uiAlert" class="hidden relative z-10 mb-6 p-3.5 rounded-xl border text-xs sm:text-sm font-medium text-center transition-all duration-300 shadow-lg">
        </div>

        <!-- Bungkus Konten Utama -->
        <div id="mainContent" class="relative z-10 space-y-5">
            
            <!-- Info Tagihan Card -->
            <div class="bg-gray-900/80 p-4 rounded-xl border border-gray-800/80 flex items-center justify-between">
                <div>
                    <span class="text-[11px] uppercase tracking-wider text-gray-500 font-semibold">Paket Dipilih</span>
                    <h3 id="invoicePlan" class="text-base sm:text-lg font-bold text-gray-100">Memuat...</h3>
                </div>
                <div class="text-right">
                    <span class="text-[11px] uppercase tracking-wider text-gray-500 font-semibold">Total Harga</span>
                    <h3 id="invoicePrice" class="text-lg sm:text-xl font-black text-emerald-400">Rp 0</h3>
                </div>
            </div>

            <!-- Form Data Akun Pterodactyl (Ubah Email jadi Password) -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Username Panel</label>
                    <input type="text" id="usernameInput" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all" placeholder="Misal: fagem" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Password Panel</label>
                    <input type="text" id="passwordInput" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all" placeholder="Buat password login Anda" required>
                </div>
            </div>

            <!-- Area QRIS -->
            <div class="text-center bg-gray-900/40 p-4 rounded-xl border border-gray-800/50">
                <p class="text-xs text-gray-400 mb-3 font-medium">Scan QRIS menggunakan E-Wallet / M-Banking:</p>
                <div class="bg-white p-3 rounded-xl inline-block w-44 h-44 sm:w-48 sm:h-48 flex items-center justify-center mx-auto shadow-md relative overflow-hidden">
                    <!-- Loading Spinner -->
                    <div id="qrisLoading" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-50 text-gray-400 gap-1">
                        <svg class="animate-spin h-6 w-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <span class="text-[10px] font-semibold tracking-wider">MEMBUAT QR...</span>
                    </div>
                    <img id="qrisImage" src="" alt="QRIS Payment" class="w-full h-full object-contain hidden relative z-10 rounded-lg">
                </div>
            </div>

            <!-- Tombol Konfirmasi -->
            <button id="btnKonfirmasi" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-lg shadow-blue-600/20 active:scale-[0.98] transition-all duration-200">
                Saya Sudah Bayar
            </button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let currentTopupId = null;

        function showNotification(message, type = 'error') {
            const alertBox = document.getElementById('uiAlert');
            alertBox.className = "relative z-10 mb-6 p-3.5 rounded-xl border text-xs sm:text-sm font-medium text-center transition-all duration-300 shadow-lg";
            
            if (type === 'error') {
                alertBox.classList.add('bg-red-950/60', 'border-red-800/80', 'text-red-300');
            } else if (type === 'success') {
                alertBox.classList.add('bg-emerald-950/60', 'border-emerald-800/80', 'text-emerald-300');
            } else {
                alertBox.classList.add('bg-blue-950/60', 'border-blue-800/80', 'text-blue-300');
            }
            
            alertBox.innerText = message;
            alertBox.classList.remove('hidden');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const planKey = urlParams.get('plan');
            const price = urlParams.get('price');
            const planName = urlParams.get('name');

            if (!price || !planName || !planKey) {
                document.getElementById('mainContent').style.display = 'none';
                showNotification("Akses ditolak: Data paket tidak valid. Mengalihkan...", "error");
                setTimeout(() => { window.location.href = "/"; }, 2500);
                return;
            }

            document.getElementById('invoicePlan').innerText = planName;
            document.getElementById('invoicePrice').innerText = 'Rp ' + parseInt(price).toLocaleString('id-ID');

            // Request QRIS
            try {
                const res = await fetch(`/api/generate-qris?amount=${price}`);
                const data = await res.json();
                
                if (data.success && data.qr_url) {
                    const qrisImg = document.getElementById('qrisImage');
                    document.getElementById('qrisLoading').style.display = 'none';
                    qrisImg.src = data.qr_url;
                    qrisImg.classList.remove('hidden');
                    currentTopupId = data.topup_id; 
                } else {
                    document.getElementById('qrisLoading').innerHTML = '<span class="text-[10px] text-red-500 font-bold">Gagal Dimuat</span>';
                    showNotification("Gagal memuat QRIS dari server pembayaran.", "error");
                }
            } catch (err) {
                document.getElementById('qrisLoading').innerHTML = '<span class="text-[10px] text-red-500 font-bold">Gangguan Jaringan</span>';
                showNotification("Tidak dapat terhubung ke server pembayaran.", "error");
            }

            // Tombol Aksi Bertahap
            document.getElementById('btnKonfirmasi').addEventListener('click', async () => {
                const username = document.getElementById('usernameInput').value.trim();
                const password = document.getElementById('passwordInput').value.trim();
                const btn = document.getElementById('btnKonfirmasi');

                if (!username || !password) {
                    showNotification("Mohon lengkapi kolom Username dan Password panel terlebih dahulu.", "error");
                    return;
                }

                if (!currentTopupId) {
                    showNotification("Sesi pembayaran belum siap. Silakan refresh halaman.", "error");
                    return;
                }

                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Memeriksa Pembayaran...`;
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
                
                showNotification("🔍 Memeriksa status mutasi pembayaran...", "info");

                try {
                    const webhookRes = await fetch('/api/webhook', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            plan_key: planKey,
                            username: username,
                            password: password, // Sekarang ngirim password ke backend
                            topup_id: currentTopupId
                        })
                    });
                    
                    const webhookData = await webhookRes.json();

                    if (!webhookRes.ok || !webhookData.success) {
                        showNotification(webhookData.error || "Pembayaran belum terdeteksi atau sistem error.", "error");
                        btn.innerHTML = "Cek Ulang Pembayaran";
                        btn.disabled = false;
                        btn.classList.remove('opacity-70', 'cursor-not-allowed');
                        return;
                    }

                    // TAMPILKAN DATA AKUN KE PEMBELI!
                    if (webhookData.success && webhookData.data_akun) {
                        // Sembunyikan form checkout & header
                        document.getElementById('mainContent').style.display = 'none';
                        document.getElementById('headerTitle').style.display = 'none';
                        
                        const alertBox = document.getElementById('uiAlert');
                        alertBox.className = "relative z-10 p-5 rounded-xl border border-emerald-800/80 bg-emerald-950/60 text-emerald-300 text-sm font-medium transition-all duration-300 shadow-lg text-left";
                        
                        // Render UI Box Keren buat Data Akun
                        alertBox.innerHTML = `
                            <div class="text-center mb-4 text-lg font-bold text-emerald-400">🎉 Server Berhasil Dibuat!</div>
                            <p class="mb-3 text-xs text-emerald-200/80 text-center">Silakan simpan atau screenshot data login Anda di bawah ini:</p>
                            
                            <div class="bg-gray-900/80 p-4 rounded-lg border border-emerald-800/50 space-y-3 font-mono text-xs sm:text-sm">
                                <div>
                                    <span class="text-gray-500 block mb-1">URL Login Panel:</span> 
                                    <a href="${webhookData.data_akun.login_url}" target="_blank" class="text-blue-400 underline block break-all">${webhookData.data_akun.login_url}</a>
                                </div>
                                <div class="border-t border-gray-800/80 pt-2">
                                    <span class="text-gray-500 inline-block w-20">Email:</span> 
                                    <span class="text-white">${webhookData.data_akun.email}</span>
                                </div>
                                <div>
                                    <span class="text-gray-500 inline-block w-20">Username:</span> 
                                    <span class="text-white">${webhookData.data_akun.username}</span>
                                </div>
                                <div>
                                    <span class="text-gray-500 inline-block w-20">Password:</span> 
                                    <span class="text-white">${webhookData.data_akun.password}</span>
                                </div>
                            </div>
                            <button onclick="window.location.href='${webhookData.data_akun.login_url}'" class="mt-5 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition">Masuk ke Panel Sekarang</button>
                        `;
                        alertBox.classList.remove('hidden');
                    }

                } catch (err) {
                    showNotification("Terjadi kendala jaringan saat memproses sistem.", "error");
                    btn.innerHTML = "Cek Ulang Pembayaran";
                    btn.disabled = false;
                    btn.classList.remove('opacity-70', 'cursor-not-allowed');
                }
            });
        });
    </script>
</body>
</html>
