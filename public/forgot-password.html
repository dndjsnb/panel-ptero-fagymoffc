<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Fahmi Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: radial-gradient(circle at top, #111827, #030712); font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .fade-out { animation: fadeOut 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-5px); } }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="glass-card p-8 rounded-2xl shadow-2xl max-w-sm w-full border border-gray-800 relative overflow-hidden">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="text-center mb-6 relative z-10">
            <div class="w-12 h-12 bg-slate-800 border border-slate-700 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-unlock-keyhole text-blue-400 text-lg"></i>
            </div>
            <h2 class="text-xl font-extrabold text-white mb-1">Reset Password</h2>
            <p class="text-xs text-gray-400">Masukkan email untuk menerima OTP via Telegram</p>
        </div>
        
        <!-- TAHAP 1: Minta OTP -->
        <form id="requestOtpForm" class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Email Terdaftar</label>
                <input type="email" id="resetEmail" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-all" placeholder="reseller@mail.com" required>
            </div>
            <button type="submit" id="btnRequestOtp" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-lg transition-all mt-2 flex justify-center items-center gap-2">
                <i class="fa-brands fa-telegram"></i> Kirim OTP ke Telegram
            </button>
        </form>

        <!-- TAHAP 2: Input OTP & Password Baru (Disembunyikan di awal) -->
        <form id="verifyOtpForm" class="space-y-4 relative z-10 hidden mt-4 pt-4 border-t border-gray-700/60 fade-in">
            <div>
                <label class="block text-[11px] font-bold text-blue-400 uppercase tracking-wider mb-1">Kode OTP Telegram</label>
                <input type="text" id="otpCode" class="w-full bg-gray-900/90 border border-blue-500/50 rounded-xl px-4 py-2.5 text-sm font-mono text-center text-white focus:outline-none focus:border-blue-500 transition-all tracking-[0.3em]" placeholder="123456" required maxlength="6">
            </div>

            <!-- Bagian Timer & Resend -->
            <div class="flex justify-between items-center px-1">
                <span id="cd-timer-text" class="text-[11px] font-semibold text-gray-400 hidden"></span>
                <button id="btn-resend-otp" type="button" onclick="resendOtp()" class="text-[11px] font-medium text-blue-400 hover:text-blue-300 transition-colors cursor-pointer flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Kirim Ulang OTP
                </button>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Password Baru</label>
                <input type="password" id="newPassword" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-all" placeholder="••••••••" required minlength="6">
            </div>
            
            <button type="submit" id="btnResetPassword" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-lg transition-all mt-2">
                Simpan Password Baru
            </button>
        </form>
        
        <p class="text-center text-xs text-gray-400 mt-6 relative z-10">
            Ingat password Anda? <a href="reseller-login.html" class="text-blue-400 hover:underline">Kembali ke Login</a>
        </p>
    </div>

    <script>
        // ==== VARIABEL COOLDOWN (ANTI-SPAM) ADAPTASI DARI DASHBOARD ====
        // Menggunakan key localStorage yang berbeda agar tidak bentrok dengan OTP profil
        let resendAttempts = parseInt(localStorage.getItem('resetOtpAttempts')) || 0;
        let cooldownEndTime = parseInt(localStorage.getItem('resetOtpCooldown')) || 0;
        let cdInterval = null;
        const cdDurations = [60, 180, 900, 1800]; // Cooldown: 1 menit, 3 menit, 15 menit, 30 menit

        // Element Referensi
        const reqForm = document.getElementById('requestOtpForm');
        const verForm = document.getElementById('verifyOtpForm');
        const emailInput = document.getElementById('resetEmail');
        const btnRequest = document.getElementById('btnRequestOtp');
        const btnResend = document.getElementById('btn-resend-otp');
        const timerText = document.getElementById('cd-timer-text');

        // ==== SISTEM TOAST (Notifikasi) ====
        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed top-5 right-5 z-[200] flex flex-col gap-3 pointer-events-none';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            const isSuccess = type === 'success';
            const bgColor = isSuccess ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-rose-500/10 border-rose-500/20 text-rose-400';
            const icon = isSuccess ? '<i class="fa-solid fa-circle-check text-lg"></i>' : '<i class="fa-solid fa-circle-exclamation text-lg"></i>';
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg backdrop-blur-md ${bgColor} fade-in transition-all duration-300`;
            toast.innerHTML = `${icon} <span class="text-sm font-medium tracking-wide">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { 
                toast.classList.replace('fade-in', 'fade-out'); 
                setTimeout(() => toast.remove(), 300); 
            }, 3500);
        }

        // ==== LOGIKA UI COOLDOWN ====
        function lockCooldownUI(timeLeft) {
            btnResend.disabled = true;
            btnResend.classList.replace('text-blue-400', 'text-gray-500');
            btnResend.classList.replace('hover:text-blue-300', 'cursor-not-allowed');
            
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            
            timerText.innerHTML = `<i class="fa-solid fa-clock"></i> Tunggu ${m > 0 ? m + 'm ' : ''}${s}s`;
            timerText.classList.remove('hidden');
        }

        function resetCooldownUI() {
            btnResend.disabled = false;
            btnResend.classList.replace('text-gray-500', 'text-blue-400');
            btnResend.classList.replace('cursor-not-allowed', 'hover:text-blue-300');
            timerText.classList.add('hidden');
        }

        function updateCooldownUI() {
            clearInterval(cdInterval);
            cdInterval = setInterval(() => {
                let timeLeft = Math.ceil((cooldownEndTime - Date.now()) / 1000);
                if (timeLeft <= 0) {
                    clearInterval(cdInterval);
                    resetCooldownUI();
                } else {
                    lockCooldownUI(timeLeft);
                }
            }, 1000);
        }

        function startResendCooldown() {
            let cdIndex = Math.min(resendAttempts, cdDurations.length - 1);
            let duration = cdDurations[cdIndex];
            
            resendAttempts++;
            cooldownEndTime = Date.now() + (duration * 1000);
            
            localStorage.setItem('resetOtpAttempts', resendAttempts);
            localStorage.setItem('resetOtpCooldown', cooldownEndTime);
            
            updateCooldownUI();
        }

        // ==== PROSES 1: MINTA OTP ====
        reqForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = emailInput.value;

            if (cooldownEndTime > Date.now()) {
                showToast("Sistem masih cooldown! Cek Telegram kamu.", 'error');
                verForm.classList.remove('hidden'); // Munculin form OTP aja
                emailInput.readOnly = true;
                btnRequest.classList.add('hidden');
                updateCooldownUI();
                return;
            }

            btnRequest.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Memproses...';
            btnRequest.disabled = true;

            try {
                const res = await fetch('/api/request-forgot-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showToast("OTP berhasil dikirim ke Telegram kamu!", 'success');
                    
                    // Transisi UI ke Tahap 2
                    emailInput.readOnly = true;
                    emailInput.classList.add('opacity-50');
                    btnRequest.classList.add('hidden');
                    verForm.classList.remove('hidden');
                    
                    startResendCooldown();
                } else {
                    showToast(data.message || "Email tidak ditemukan!", 'error');
                    btnRequest.innerHTML = '<i class="fa-brands fa-telegram"></i> Kirim OTP ke Telegram';
                    btnRequest.disabled = false;
                }
            } catch (err) {
                showToast('Server gagal dihubungi!', 'error');
                btnRequest.innerHTML = '<i class="fa-brands fa-telegram"></i> Kirim OTP ke Telegram';
                btnRequest.disabled = false;
            }
        });

        // ==== PROSES 2: KIRIM ULANG OTP (RESEND) ====
        async function resendOtp() {
            if (cooldownEndTime > Date.now()) return;
            
            btnResend.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Mengirim...';
            
            try {
                const res = await fetch('/api/request-forgot-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showToast("OTP baru telah dikirim ke Telegram!", 'success');
                    startResendCooldown();
                } else {
                    showToast(data.message || "Gagal mengirim OTP", 'error');
                }
            } catch (err) {
                showToast('Server gagal dihubungi!', 'error');
            } finally {
                btnResend.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Kirim Ulang OTP';
            }
        }

        // ==== PROSES 3: VERIFIKASI & RESET PASSWORD ====
        verForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const otp = document.getElementById('otpCode').value;
            const newPassword = document.getElementById('newPassword').value;
            const btnReset = document.getElementById('btnResetPassword');

            btnReset.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-2"></i> Memproses...';
            btnReset.disabled = true;

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value, otp, newPassword })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showToast("Password berhasil diubah! Mengalihkan...", 'success');
                    
                    // Bersihkan cache cooldown reset pw
                    localStorage.removeItem('resetOtpAttempts');
                    localStorage.removeItem('resetOtpCooldown');
                    
                    // Lempar ke halaman login setelah sukses
                    setTimeout(() => { window.location.href = 'reseller-login.html'; }, 2000);
                } else {
                    showToast(data.message || "Kode OTP salah atau kadaluarsa!", 'error');
                    btnReset.innerHTML = 'Simpan Password Baru';
                    btnReset.disabled = false;
                }
            } catch (err) {
                showToast("Terjadi kesalahan server!", 'error');
                btnReset.innerHTML = 'Simpan Password Baru';
                btnReset.disabled = false;
            }
        });

        // Cek jika halaman direfresh saat sedang cooldown
        if (cooldownEndTime > Date.now()) {
            // (Opsional) Langsung munculkan form jika email tersimpan di memory/session
            // Di contoh ini, user harus masukin email lagi baru form OTP muncul kalau refresh.
        }
    </script>
</body>
</html>
